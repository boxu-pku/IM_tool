name: Build macOS installers

on:
  workflow_dispatch:
  push:
    tags: ['macos-v*']

permissions:
  contents: read

jobs:
  package:
    name: DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt Pillow 'PyInstaller>=6,<7'
      - name: Build native disk image
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python packaging/build_desktop.py macos
      - name: Verify the installed app and the aluminum–quartz exercise
        run: |
          python -m pip install --only-binary=:all: pyobjc-framework-Quartz
          python tests/smoke_test_macos_install.py dist/desktop/*-${{ matrix.arch }}.dmg
          python tests/smoke_test_practice_workspace.py
      - uses: actions/upload-artifact@v4
        with:
          name: IM-Tool-macOS-${{ matrix.arch }}
          path: dist/desktop/*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/macos-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: IM-Tool-macOS-*
          merge-multiple: true
          path: images
      - name: Publish the two verified disk images
        working-directory: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum IM-Tool-*-macOS-*.dmg > SHA256SUMS-macOS.txt
          cat > "$RUNNER_TEMP/mac-release.md" <<'NOTES'
          在“关于本机”查看芯片。Apple M 系列选 `arm64`，Intel 选 `x86_64`。打开磁盘映像，将 **IM Tool.app** 拖入 **Applications**，推出映像，再从“应用程序”启动。

          Choose the disk image for your chip, drag **IM Tool.app** onto **Applications**, eject the image and launch the installed app. The two offline manuals and the Celliers aluminum–Hamel quartz exercise are in the Help menu.

          本版采用临时签名，未经 Apple 公证。The app is ad hoc signed and has no Apple notarization. [Apple 首次打开说明](https://support.apple.com/zh-cn/102445) · [Apple first-launch instructions](https://support.apple.com/en-us/102445).
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "IM Tool for macOS · ${GITHUB_REF_NAME#macos-v}" \
            --notes-file "$RUNNER_TEMP/mac-release.md" *.dmg SHA256SUMS-macOS.txt
